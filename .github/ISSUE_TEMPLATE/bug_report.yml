name: Bug report
description: Something behaves differently from what it says on the tin.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The fields below exist because muxtop's
        behaviour depends heavily on **which terminal**, **which platform** and
        **local vs `--remote`** — a report without those usually needs a round
        trip before anyone can even try to reproduce it.

        ⚠️ **Found a vulnerability?** Do not file it here. Use
        [private security reporting](https://github.com/lucasschimmel/muxtop/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/lucasschimmel/muxtop/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
      placeholder: |
        The Containers tab stays on "no engine configured" even though `docker ps` works.
        I expected it to list my three running containers.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The shortest path from a fresh shell to the problem, including the exact flags.
      placeholder: |
        1. `muxtop --refresh 2`
        2. Press `Alt+4`
        3. Panel reads "no engine configured"
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: muxtop version
      description: Output of `muxtop --version`. If the bug is in the server, add `muxtop-server --version`.
      placeholder: muxtop 0.5.1
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How was it installed
      options:
        - cargo install
        - Homebrew
        - APT
        - install.sh / release archive
        - built from source
        - other
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      description: Distribution or macOS version, plus `uname -m`.
      placeholder: Debian 13, x86_64 — or macOS 15.3, arm64
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal, $TERM and $COLORTERM
      description: >
        Rendering bugs are almost always terminal-specific. Run
        `echo "$TERM / $COLORTERM"` and say which terminal (and whether you are
        inside tmux, screen or ssh).
      placeholder: kitty, xterm-kitty / truecolor — inside tmux over ssh
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - local
        - "--remote (TLS with --tls-ca)"
        - "--remote (--tls-skip-verify)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - General tab
        - Processes tab
        - Network tab
        - Containers tab
        - Kubernetes tab
        - GPU tab
        - Command palette / command mode
        - Inspector / overlays
        - Colours, glyphs or layout
        - Keybindings
        - muxtop-server / remote protocol
        - CLI, startup or packaging
        - something else
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        muxtop logs warnings and errors to a file — nothing is printed to the
        terminal, since the terminal is the UI.

        - Linux: `~/.local/share/muxtop/muxtop.log`
        - macOS: `~/Library/Application Support/muxtop/muxtop.log`
        - server: same directory, `muxtop-server.log`

        For much more detail, re-run with `MUXTOP_LOG=debug muxtop` and attach
        the new lines. **Read before pasting** — logs may contain process
        command lines, container names and hostnames from your machine.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest release, or I have said above why I cannot be.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true
